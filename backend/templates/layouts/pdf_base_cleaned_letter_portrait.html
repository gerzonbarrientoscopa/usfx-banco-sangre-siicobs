{% load static %}
<html>
<head>
     <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <style>
        @page {
            size: letter portrait;
            @frame header_frame {           /* Static Frame */
                -pdf-frame-content: header_content;
                left: 55pt; width: 522pt; top: 30pt; height: 140pt;
            }
            @frame content_frame {          /* Content Frame */
                left: 55pt; width: 522pt; top: 110pt; height: 630pt;
            }
            @frame footer_frame {           /* Another static Frame */
                -pdf-frame-content: footer_content;
                left: 55pt; width: 522pt; top: 760pt; height: 20pt;
            }

            @frame footer_frame {           /* Another static Frame */
                -pdf-frame-content: footer_note_content;
                left: 55pt; width: 522pt; top: 730pt; height: 100pt;
            }

        }
    </style>
    {% include 'layouts/base_css.html' %}
</head>

<body>
    <div class="container">
        {% block layout %}
        {% endblock %}
    </div>
</body>
</html>
