    <style type="text/css">
        table {
            *border-collapse: collapse; /* IE7 and lower */
            border-spacing: 0;
            width: 100%;
            padding-top: 2px;
            padding-left: 2px;
        }

        table.bordered {
            border: solid #2d2d2d 1px;
        }

        .table-odd tr:nth-child(even) {
            background: #2d2d2d !important;
        }

        table.bordered td.left, .bordered th.left {
            border-left: 1px solid #2d2d2d;
            text-align: left;
        }

        table.bordered td.right, .bordered th.right {
            border-right: 1px solid #2d2d2d;
            text-align: left;
        }

        table.bordered td.bottom, .bordered th.bottom {
            border-bottom: 1px solid #2d2d2d;
            text-align: left;
        }

        table.bordered td.top, .bordered th.top {
            border-top: 1px solid #2d2d2d;
            text-align: left;
        }

        table.padding-10 td, table.padding-10 th {
            padding: 10px;
        }

        table.bordered th {
            background-color: #dce9f9;
            background-image: -webkit-gradient(linear, left top, left bottom, from(#ebf3fc), to(#dce9f9));
            background-image: -webkit-linear-gradient(top, #ebf3fc, #dce9f9);
            background-image: -moz-linear-gradient(top, #ebf3fc, #dce9f9);
            background-image: -ms-linear-gradient(top, #ebf3fc, #dce9f9);
            background-image: -o-linear-gradient(top, #ebf3fc, #dce9f9);
            background-image: linear-gradient(top, #ebf3fc, #dce9f9);
            border-top: none;
            text-shadow: 0 1px 0 rgba(255, 255, 255, .5);
        }

        table.bordered td:first-child, .bordered th:first-child {
            border-left: none;
        }

        .table .bordered {
            border: 1px solid #2d2d2d !important;
        }

            padding-left: 2px;
        }
